# Dependency updates. Security fixes arrive as their own PRs, outside these groups.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
